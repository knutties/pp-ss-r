[package]
name = "pp-ss-r"
version = "0.1.0"
edition = "2021"

[lib]
name = "pp_ss_r"
path = "src/lib.rs"

[[bin]]
name = "pp-ss-r"
path = "src/main.rs"

[dependencies]
actix-web = "4"
actix-files = "0.6"
maud = "0.26"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
actix-rt = "2"
