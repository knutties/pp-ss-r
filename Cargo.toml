[package]
name = "pp-ss-r"
version = "0.1.0"
edition = "2021"

[lib]
name = "pp_ss_r"
path = "src/lib.rs"

[[bin]]
name = "pp-ss-r"
path = "src/main.rs"

[dependencies]
actix-web = "4"
actix-files = "0.6"
# HTTP + HTTPS client. native-tls uses the system Security framework on macOS
# and OpenSSL on Linux — reliable across our Nix dev shell and Docker builds.
reqwest = { version = "0.12", default-features = false, features = ["json", "native-tls"] }
uuid = { version = "1", features = ["v4"] }
maud = "0.26"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["json", "env-filter"] }

[dev-dependencies]
actix-rt = "2"
actix-test = "0.1"
